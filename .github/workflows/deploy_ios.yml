name: Deploy iOS App to TestFlight

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/deploy_ios.yml'
    branches: [ main, master ]
  workflow_dispatch:

env:
  FASTLANE_SKIP_UPDATE_CHECK: "true"
  FASTLANE_HIDE_CHANGELOG: "true"
  FASTLANE_DISABLE_ANIMATION: "true"
  CI: "true"

jobs:
  build-and-upload:
    name: Build & Upload to Apple TestFlight
    runs-on: macos-15

    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Run Fastlane Beta
        env:
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: "vjhd-ddhu-qrin-mnme"
          FASTLANE_USER: "etaseturunleri@gmail.com"
        run: |
          fastlane ios beta || (cat ~/Library/Logs/gym/*.log; exit 1)


      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ~/Library/Logs/gym/*.log
      - name: Push logs to branch
        if: failure()
        run: |
          mkdir -p build_logs
          cp ~/Library/Logs/gym/*.log build_logs/ || echo "No gym logs" > build_logs/error.log
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout -B debug-logs
          git add build_logs/
          git commit -m "ci: dump build logs"
          git push -f origin debug-logs

