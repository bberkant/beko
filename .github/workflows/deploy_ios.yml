name: Deploy iOS App to TestFlight

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/deploy_ios.yml'
    branches: [ main, master ]
  workflow_dispatch:

env:
  FASTLANE_SKIP_UPDATE_CHECK: "true"
  FASTLANE_HIDE_CHANGELOG: "true"
  FASTLANE_DISABLE_ANIMATION: "true"
  CI: "true"

jobs:
  build-and-upload:
    name: Build & Upload to Apple TestFlight
    runs-on: macos-15

    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Run Fastlane Beta
        env:
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: "vjhd-ddhu-qrin-mnme"
          FASTLANE_USER: "etaseturunleri@gmail.com"
        run: |
          fastlane ios beta || (cat ~/Library/Logs/gym/*.log; exit 1)

