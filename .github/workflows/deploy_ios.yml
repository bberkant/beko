name: Deploy iOS App to TestFlight

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/deploy_ios.yml'
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build & Upload to Apple TestFlight
    runs-on: macos-14

    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install Dependencies
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and Upload with Fastlane
        run: |
          gem install fastlane --no-document
          fastlane beta --verbose
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: "T7BGJ39HPK"
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: "6025c8a1-87c2-474e-aa8d-8b6b07a6d268"
          APP_STORE_CONNECT_API_KEY_KEY_FILEPATH: "./AuthKey_T7BGJ39HPK.p8"
