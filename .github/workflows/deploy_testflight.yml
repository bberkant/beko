# ==============================================================================
# Apple TestFlight Automated Continuous Deployment Pipeline
# Project: dars_ios_app (Kuveyt Türk Corporate Banking iOS Native App)
# Target: com.amasyaetas.mobile (Apple Developer Team WGARWL7QZ4)
# Runner: macos-14 (Apple Silicon M1/M2)
# ==============================================================================

name: Deploy to Apple TestFlight

'on':
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip unit test execution (emergency deployment only)'
        required: false
        type: boolean
        default: false
      verbose:
        description: 'Enable verbose fastlane output logging'
        required: false
        type: boolean
        default: false

concurrency:
  group: testflight-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Upload to Apple TestFlight
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Verify Xcode & SDK Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Tools (XcodeGen)
        run: |
          if ! command -v xcodegen &> /dev/null; then
            echo "Installing XcodeGen via Homebrew..."
            brew install xcodegen
          fi
          xcodegen --version
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - name: Cache Swift Package Manager Dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Generate Xcode Project via XcodeGen
        run: |
          echo "Generating Xcode project from project.yml..."
          xcodegen generate
          if [ ! -d "dars-ios.xcodeproj" ]; then
            echo "::error::dars-ios.xcodeproj was not generated!"
            exit 1
          fi
          echo "Successfully generated dars-ios.xcodeproj"

      - name: Configure App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys

          if [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" ]; then
            echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > AuthKey_T7BGJ39HPK.p8
            echo "Successfully decoded API Key from APP_STORE_CONNECT_API_KEY_BASE64"
          elif [ -n "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > AuthKey_T7BGJ39HPK.p8
            echo "Successfully loaded API Key from APP_STORE_CONNECT_PRIVATE_KEY"
          else
            echo "::warning::Neither APP_STORE_CONNECT_API_KEY_BASE64 nor APP_STORE_CONNECT_PRIVATE_KEY secret is configured in GitHub Secrets!"
          fi

          if [ -f "AuthKey_T7BGJ39HPK.p8" ]; then
            cp AuthKey_T7BGJ39HPK.p8 ~/.appstoreconnect/private_keys/AuthKey_T7BGJ39HPK.p8
            chmod 600 AuthKey_T7BGJ39HPK.p8 ~/.appstoreconnect/private_keys/AuthKey_T7BGJ39HPK.p8
            echo "AuthKey_T7BGJ39HPK.p8 installed to local root and ~/.appstoreconnect/private_keys/ (chmod 0600)"
          fi

      - name: Run Fastlane Unit Tests
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          bundle exec fastlane test || fastlane test
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "4"

      - name: Run Fastlane TestFlight Beta Deployment
        run: |
          bundle exec fastlane beta || fastlane beta
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: "T7BGJ39HPK"
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || 'c29ba154-2062-4309-8588-4bbec249ad0c' }}
          APP_STORE_CONNECT_API_KEY_KEY_FILEPATH: "./AuthKey_T7BGJ39HPK.p8"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "4"
          VERBOSE: ${{ github.event.inputs.verbose || 'false' }}

      - name: Upload Build Artifacts & Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-artifacts-and-logs-${{ github.run_number }}
          path: |
            *.ipa
            *.dSYM.zip
            fastlane/test_output/
            ~/Library/Logs/gym/*.log
            ~/Library/Logs/scan/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Apple TestFlight Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ Succeeded' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch / Ref** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Runner Architecture** | macos-14 (Apple Silicon M1/M2) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Xcode Target Version** | 15.4 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bundle Identifier** | \`com.amasyaetas.mobile\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Apple Team ID** | \`WGARWL7QZ4\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **App Store Connect Key ID** | \`T7BGJ39HPK\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
